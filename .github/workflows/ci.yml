name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,all]"
      - run: ruff check testbench tests
      - run: ruff format --check testbench tests
      - run: mypy testbench/core
      - run: python -m pytest -m "not mobile and not game and not ai and not recorder"

  web-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,all]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m "not mobile and not game and not ai"
