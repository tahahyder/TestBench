name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,all]"
      - run: ruff check testbench tests
      - run: mypy testbench/core
      - run: python -m pytest -m "not mobile and not game and not ai and not recorder"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  fresh-install:
    needs: build-test-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install dist/testbench-*.whl
      - run: .venv/bin/testbench init demo
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: cd demo && ../.venv/bin/testbench doctor && ../.venv/bin/testbench run tests/
