[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testbench"
version = "0.1.0"
description = "A local-first test automation workbench for web, Android, and games."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TestBench contributors" }]
keywords = ["test-automation", "playwright", "appium", "opencv", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "certifi>=2026.10.18",
  "fastapi>=0.110",
  "Pillow>=10.0",
  "playwright>=1.42",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.54.0",
]

[project.optional-dependencies]
mobile = [
  "appium-python-client>=4.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "urllib3>=2.8.0",
]
game = [
  "mss>=9.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pyautogui>=0.9.54",
  "pynput>=1.7.6",
  "pytesseract>=0.3.10",
]
ai = [
  "faker>=24.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "openai>=1.30",
]
all = [
  "appium-python-client>=4.0",
  "faker>=24.0",
  "mss>=9.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "openai>=1.30",
  "pyautogui>=0.9.54",
  "pynput>=1.7.6",
  "pytesseract>=0.3.10",
  "urllib3>=2.8.0",
]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
testbench = "testbench.cli:app"

[project.entry-points."testbench.drivers"]
web = "testbench.drivers.web:WebDriver"
android = "testbench.drivers.mobile:MobileDriver"
game = "testbench.drivers.game:GameDriver"

[project.entry-points."testbench.steps"]

[project.entry-points."testbench.hooks"]

[tool.setuptools.packages.find]
include = ["testbench*"]

[tool.setuptools.package-data]
testbench = [
  "ui/templates/*.html",
  "ui/static/*.css",
  "ui/static/*.js",
  "ui/static/*.png",
  "ui/static/*.svg",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["testbench/core"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=testbench --cov-report=term-missing"
markers = [
  "mobile: requires a running Appium server and connected Android device",
  "game: runs game-surface integration tests",
  "recorder: runs interaction recorder integration tests",
  "ai: requires an explicitly configured and reachable AI provider",
]
