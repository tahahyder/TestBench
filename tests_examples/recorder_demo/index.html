<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestBench Recorder Demo</title>
  <style>
    body { max-width: 640px; margin: 3rem auto; padding: 1rem; font: 16px system-ui, sans-serif; }
    form { display: grid; gap: .75rem; }
    label { display: grid; gap: .25rem; }
    .check-row { display: flex; align-items: center; gap: .5rem; }
    button { width: fit-content; padding: .5rem 1rem; }
    output { display: block; min-height: 1.5rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Recorder Demo</h1>
  <form>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">

    <label for="plan">Plan</label>
    <select id="plan" name="plan">
      <option>Basic</option>
      <option>Professional</option>
    </select>

    <div class="check-row">
      <input id="terms" name="terms" type="checkbox">
      <label for="terms">Accept terms</label>
    </div>

    <button id="submit" type="button">Continue</button>
  </form>
  <output id="result" aria-live="polite"></output>
  <script>
    document.querySelector("#submit").addEventListener("click", () => {
      document.querySelector("#result").textContent = "Submitted successfully";
    });
  </script>
</body>
</html>
