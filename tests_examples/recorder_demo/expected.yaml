name: Recorded form submission
target: web
config:
  browser: chromium
  url: http://127.0.0.1:8001/index.html
variables:
  - LOGIN_PASSWORD
steps:
  - open: http://127.0.0.1:8001/index.html
  - type:
      field:
        role:
          role: textbox
          name: Email address
      value: qa@example.test
  - type:
      field:
        role:
          role: textbox
          name: Password
      value: ${LOGIN_PASSWORD}
  - select_option:
      field:
        role:
          role: combobox
          name: Plan
      value: Professional
  - click:
      role:
        role: checkbox
        name: Accept terms
  - click:
      role:
        role: button
        name: Continue
  - wait: 0.2
